<div class="container mt-5">
  <table class="table">
    <thead>
      <tr>
        <th scope="col">Image</th>
        <th scope="col">Chinese Name</th>
        <th scope="col">Portuguese Name</th>
        <th scope="col">Description</th>
      </tr>
    </thead>
    <tbody>
      @for (item of pratos; track item.nome) {
        <tr>
          <td style="width: 300px"><img [src]="item.imageUrl" style="width: 100%;"/></td>
          <td style="width: 150px">{{ item.chineseName }}</td>
          <td>
            <button (click)="copyTitle(item.portugueseName)">
              Copy
            </button>
            {{ item.portugueseName }}
          </td>
          <td>
            <button (click)="copyDesc(item.description)">
              Copy
            </button>
            {{ item.description }}
          </td>
        </tr>
      }

    </tbody>
  </table>

</div>
